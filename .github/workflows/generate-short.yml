name: Generate Short
run-name: "Short Cloud Studio — ${{ inputs.topic }}"
on:
  workflow_dispatch:
    inputs:
      topic: { description: Tema do vídeo, required: true, type: string }
      plan_json: { description: Plano aprovado em JSON, required: true, type: string }
      duration: { description: Duração alvo, required: true, default: "65", type: string }
      tone: { description: Tom, required: true, default: cinematic, type: string }
      niche_key: { description: Nicho, required: true, default: custom, type: string }
      visual_style: { description: Visual, required: true, default: realistic, type: string }
      cartoon_style: { description: Estilo do desenho, required: true, default: classic-2d, type: string }
      media_mode: { description: Mídia, required: true, default: hybrid, type: string }
      voice: { description: Voz, required: true, default: pt-BR-FranciscaNeural, type: string }
      voice_pitch: { description: Tom da voz, required: true, default: default, type: string }
      voice_speed: { description: Velocidade da voz, required: true, default: default, type: string }
      captions: { description: Legendas, required: true, default: "on", type: string }
      caption_font: { description: Fonte, required: true, default: "Montserrat", type: string }
      caption_size: { description: Tamanho da fonte, required: true, default: "56", type: string }
      music: { description: Trilha, required: true, default: "off", type: string }
      music_volume: { description: Volume, required: true, default: medium, type: string }
      request_id: { description: ID, required: false, type: string }
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Baixar Short Cloud Studio
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Instalar motor de vídeo
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-liberation fonts-montserrat fonts-lato fonts-noto-core fonts-roboto espeak-ng libsndfile1
          fc-cache -f
          python -m pip install --upgrade pip
          pip install requests==2.32.5 piper-tts==1.7.0 edge-tts==7.2.3 soundfile==0.13.1 Pillow==11.3.0 numpy==2.2.6
      - name: Preparar voz brasileira
        run: |
          mkdir -p models
          curl -L --fail --retry 3 -o models/pt_BR-faber-medium.onnx https://huggingface.co/rhasspy/piper-voices/resolve/main/pt/pt_BR/faber/medium/pt_BR-faber-medium.onnx
          curl -L --fail --retry 3 -o models/pt_BR-faber-medium.onnx.json https://huggingface.co/rhasspy/piper-voices/resolve/main/pt/pt_BR/faber/medium/pt_BR-faber-medium.onnx.json
      - name: Gerar mídia e montar vídeo
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: qwen/qwen3.8-27b
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          PIPER_MODEL_PATH: models/pt_BR-faber-medium.onnx
          INPUT_VOICE: ${{ inputs.voice }}
          INPUT_VOICE_PITCH: ${{ inputs.voice_pitch }}
          INPUT_VOICE_SPEED: ${{ inputs.voice_speed }}
          INPUT_TOPIC: ${{ inputs.topic }}
          INPUT_PLAN_JSON: ${{ inputs.plan_json }}
          INPUT_DURATION: ${{ inputs.duration }}
          INPUT_TONE: ${{ inputs.tone }}
          INPUT_NICHE_KEY: ${{ inputs.niche_key }}
          INPUT_VISUAL_STYLE: ${{ inputs.visual_style }}
          INPUT_CARTOON_STYLE: ${{ inputs.cartoon_style }}
          INPUT_MEDIA_MODE: ${{ inputs.media_mode }}
          INPUT_CAPTIONS: ${{ inputs.captions }}
          INPUT_CAPTION_FONT: ${{ inputs.caption_font }}
          INPUT_CAPTION_SIZE: ${{ inputs.caption_size }}
          INPUT_MUSIC: ${{ inputs.music }}
          INPUT_MUSIC_VOLUME: ${{ inputs.music_volume }}
        run: |
          python scripts/apply_render_policies.py
          python scripts/generate_turbo_v2.py
          python scripts/validate_religious_media.py
          python scripts/normalize_duration.py
          python scripts/prepare_output_name.py
      - name: Validar vídeo
        env:
          TARGET_DURATION: ${{ inputs.duration }}
        run: |
          VIDEO="output/$(cat output/video_name.txt)"
          test -s "$VIDEO"
          python - <<'PY'
          import json,os,subprocess,sys
          video='output/'+open('output/video_name.txt',encoding='utf-8').read().strip()
          data=json.loads(subprocess.check_output(['ffprobe','-v','error','-show_streams','-show_format','-of','json',video],text=True))
          streams=data.get('streams',[])
          v=next((s for s in streams if s.get('codec_type')=='video'),None)
          a=next((s for s in streams if s.get('codec_type')=='audio'),None)
          dur=float(data.get('format',{}).get('duration') or 0)
          target=float(os.environ['TARGET_DURATION'])
          if not v or int(v.get('width',0))!=1080 or int(v.get('height',0))!=1920: sys.exit('Resolução final inválida')
          if not a: sys.exit('Áudio final ausente')
          if abs(dur-target)>0.75: sys.exit(f'Duração final inválida: {dur:.2f}s')
          if int(data.get('format',{}).get('size') or 0)<500000: sys.exit('Arquivo final pequeno demais')
          print(f'Vídeo validado: 1080x1920, {dur:.2f}s, áudio presente')
          PY
      - name: Guardar vídeo
        uses: actions/upload-artifact@v4
        with:
          name: short-cloud-${{ github.run_id }}
          path: |
            output/*.mp4
            output/video_name.txt
          retention-days: 2
          compression-level: 0
      - name: Publicar vídeo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE=$(python -c "import json; print(json.load(open('output/metadata.json',encoding='utf-8')).get('title','Short Cloud Studio'))")
          VIDEO="output/$(cat output/video_name.txt)"
          gh release create "short-${GITHUB_RUN_ID}" "$VIDEO" --title "$TITLE" --notes "Vídeo pronto."
