name: Studio Scale checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Conferir sintaxe dos arquivos
        run: |
          node --check lib/scale-handler.js
          node --check api/generate.js
          python -m py_compile scripts/scale_render.py
      - name: Instalar dependências
        run: npm ci
      - name: Compilar as interfaces
        run: npm run build
