name: Analyze Illustrated Source
run-name: "Análise ilustrada — ${{ inputs.request_id }}"
on:
  workflow_dispatch:
    inputs:
      request_id: { description: Identificador, required: true, type: string }
      secure_payload: { description: Dados temporários protegidos, required: true, type: string }
permissions:
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Preparar o Studio
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Preparar recursos de análise
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Baixar e preparar o conteúdo
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-liberation
          python -m pip install --upgrade pip
          pip install requests==2.32.5 Pillow==11.3.0 cryptography yt-dlp
      - name: Transcrever e compreender
        run: echo "Preparando transcrição e quadros temporizados."
      - name: Criar storyboard ilustrado
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: qwen/qwen3.8-27b
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_VISION_MODEL: gemini-3.1-flash-lite
          WORKFLOW_PAYLOAD_SECRET: ${{ secrets.WORKFLOW_PAYLOAD_SECRET }}
        run: python scripts/analyze_illustrated_source.py
      - name: Disponibilizar storyboard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: storyboard-${{ inputs.request_id }}
          path: |
            output/illustrated_plan.enc
            output/illustrated_error.enc
          if-no-files-found: ignore
          retention-days: 1
