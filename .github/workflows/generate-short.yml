name: Generate Short
run-name: "Short Cloud Studio — ${{ inputs.request_id }}"
on:
  workflow_dispatch:
    inputs:
      request_id: { description: Identificador, required: true, type: string }
      secure_payload: { description: Configuração protegida da geração, required: true, type: string }
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Baixar Short Cloud Studio
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Preparar memória visual
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p work_turbo
          gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --jq '.[].body // ""' > work_turbo/media_history_notes.txt || true
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Instalar motor de vídeo
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-liberation fonts-montserrat fonts-lato fonts-noto-core fonts-roboto espeak-ng libsndfile1
          fc-cache -f
          python -m pip install --upgrade pip
          pip install requests==2.32.5 piper-tts==1.7.0 edge-tts==7.2.3 soundfile==0.13.1 Pillow==11.3.0 numpy==2.2.6 google-genai cryptography yt-dlp
          mkdir -p assets
          curl -L --fail --retry 3 -o assets/PatrickHand-Regular.ttf https://raw.githubusercontent.com/google/fonts/main/ofl/patrickhand/PatrickHand-Regular.ttf
      - name: Preparar voz brasileira
        run: |
          mkdir -p models
          curl -L --fail --retry 3 -o models/pt_BR-faber-medium.onnx https://huggingface.co/rhasspy/piper-voices/resolve/main/pt/pt_BR/faber/medium/pt_BR-faber-medium.onnx
          curl -L --fail --retry 3 -o models/pt_BR-faber-medium.onnx.json https://huggingface.co/rhasspy/piper-voices/resolve/main/pt/pt_BR/faber/medium/pt_BR-faber-medium.onnx.json
      - name: Gerar mídia e montar vídeo
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: qwen/qwen3.8-27b
          WORKFLOW_PAYLOAD_SECRET: ${{ secrets.WORKFLOW_PAYLOAD_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_TTS_MODEL: gemini-3.1-flash-tts-preview
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          PIPER_MODEL_PATH: models/pt_BR-faber-medium.onnx
          MEDIA_HISTORY_NOTES_PATH: work_turbo/media_history_notes.txt
        run: python scripts/run_secure_generation.py generate
      - name: Aplicar edição dinâmica
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          WORKFLOW_PAYLOAD_SECRET: ${{ secrets.WORKFLOW_PAYLOAD_SECRET }}
        run: python scripts/run_secure_generation.py finish
      - name: Validar vídeo
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          WORKFLOW_PAYLOAD_SECRET: ${{ secrets.WORKFLOW_PAYLOAD_SECRET }}
        run: python scripts/run_secure_generation.py validate
      - name: Guardar vídeo
        uses: actions/upload-artifact@v4
        with:
          name: short-cloud-${{ github.run_id }}
          path: |
            output/*.mp4
            output/*.srt
            output/video_name.txt
            output/media_usage.json
          retention-days: 2
          compression-level: 0
      - name: Publicar vídeo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE=$(python -c "import json; print(json.load(open('output/metadata.json',encoding='utf-8')).get('title','Short Cloud Studio'))")
          VIDEO="output/$(cat output/video_name.txt)"
          USAGE=$(python -c "import base64,pathlib; p=pathlib.Path('output/media_usage.json'); print(base64.b64encode((p.read_bytes() if p.exists() else b'{}')).decode())")
          printf 'Vídeo pronto.\n\nMEDIA_USAGE_B64:%s\n' "$USAGE" > output/release_notes.txt
          EXTRA=()
          test -s output/final_sem_legenda.mp4 && EXTRA+=(output/final_sem_legenda.mp4)
          test -s output/captions.srt && EXTRA+=(output/captions.srt)
          gh release create "short-${GITHUB_RUN_ID}" "$VIDEO" "${EXTRA[@]}" --title "$TITLE" --notes-file output/release_notes.txt
