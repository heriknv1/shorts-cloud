name: Generate Short
run-name: "Short Cloud Studio — ${{ inputs.topic }}"
on:
  workflow_dispatch:
    inputs:
      topic: { description: Tema do vídeo, required: true, type: string }
      plan_json: { description: Plano aprovado em JSON, required: true, type: string }
      duration: { description: Duração alvo, required: true, default: "65", type: string }
      tone: { description: Tom, required: true, default: cinematic, type: string }
      niche_key: { description: Nicho, required: true, default: custom, type: string }
      visual_style: { description: Modo visual, required: true, default: cartoon, type: string }
      cartoon_style: { description: Estilo do desenho, required: true, default: classic-2d, type: string }
      media_mode: { description: Mídia, required: true, default: photos, type: string }
      voice: { description: Voz, required: true, default: pt-BR-AntonioNeural, type: string }
      captions: { description: Legendas, required: true, default: "on", type: string }
      music: { description: Trilha, required: true, default: "off", type: string }
      music_volume: { description: Volume, required: true, default: medium, type: string }
      request_id: { description: ID, required: false, type: string }
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Baixar Turbo v2
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Instalar motor Turbo
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core espeak-ng libsndfile1
          python -m pip install --upgrade pip
          pip install requests==2.32.5 piper-tts==1.7.0 edge-tts==7.2.3 soundfile==0.13.1 Pillow==11.3.0 numpy==2.2.6
      - name: Preparar voz brasileira
        run: |
          mkdir -p models
          curl -L --fail --retry 3 -o models/pt_BR-faber-medium.onnx https://huggingface.co/rhasspy/piper-voices/resolve/main/pt/pt_BR/faber/medium/pt_BR-faber-medium.onnx
          curl -L --fail --retry 3 -o models/pt_BR-faber-medium.onnx.json https://huggingface.co/rhasspy/piper-voices/resolve/main/pt/pt_BR/faber/medium/pt_BR-faber-medium.onnx.json
      - name: Gerar ilustrações Cartoon
        env:
          PIPER_MODEL_PATH: models/pt_BR-faber-medium.onnx
          INPUT_VOICE: ${{ inputs.voice }}
          EDGE_TTS_RATE: "-5%"
          INPUT_TOPIC: ${{ inputs.topic }}
          INPUT_PLAN_JSON: ${{ inputs.plan_json }}
          INPUT_DURATION: ${{ inputs.duration }}
          INPUT_TONE: ${{ inputs.tone }}
          INPUT_NICHE_KEY: ${{ inputs.niche_key }}
          INPUT_VISUAL_STYLE: cartoon
          INPUT_CARTOON_STYLE: ${{ inputs.cartoon_style }}
          INPUT_CAPTIONS: ${{ inputs.captions }}
          INPUT_MUSIC: ${{ inputs.music }}
          INPUT_MUSIC_VOLUME: ${{ inputs.music_volume }}
        run: python scripts/generate_turbo.py
      - name: Validar MP4
        run: |
          test -s output/final.mp4
          ffprobe -v error -show_entries format=duration,size -of json output/final.mp4
      - name: Guardar vídeo
        uses: actions/upload-artifact@v4
        with:
          name: short-cloud-${{ github.run_id }}
          path: |
            output/final.mp4
            output/metadata.json
          retention-days: 2
          compression-level: 0
      - name: Publicar MP4
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE=$(python -c "import json; print(json.load(open('output/metadata.json',encoding='utf-8')).get('title','Short Cloud Studio'))")
          gh release create "short-${GITHUB_RUN_ID}" output/final.mp4 output/metadata.json --title "$TITLE" --notes "Short Cloud Studio — vídeo gerado em Cartoon."
